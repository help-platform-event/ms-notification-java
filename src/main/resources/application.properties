spring.application.name=ms-notification
server.port=8085

# --- Datasource (dev) ---
# spring-boot-docker-compose derives these from compose.yaml when Docker is running; the values
# below are the fallback for a manually-started MySQL.
spring.datasource.url=jdbc:mysql://localhost:3309/ms_notification
spring.datasource.username=ms_notification
spring.datasource.password=ms_notification

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# --- Kafka ---
# The broker is ms-auth-java's (its compose.yaml, host port 9094): there is only one Kafka.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
# One consumer group for the whole service: its instances share the partitions, and Kafka tracks
# the group's position (offset) in each topic.
spring.kafka.consumer.group-id=ms-notification
# A brand-new group starts from the oldest retained message, not "from now": that is what lets
# this service build its projection of every existing user.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Never create a topic by subscribing to it (the broker would create it with 1 partition): the
# producers declare their topics, and a listener waits until its topic exists.
spring.kafka.consumer.properties.allow.auto.create.topics=false
# The producer is only used to publish failed records to the dead-letter topics, as the raw
# strings they were consumed as.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

# --- Mail (Mailpit in dev: SMTP 1025, UI http://localhost:8025) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:no-reply@help.local}
# JavaMail waits forever by default: an SMTP server that stops answering would freeze the Kafka
# consumer. With these, a send fails after 5 s and the record goes through the normal retries.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
